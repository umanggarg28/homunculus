<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b1013" />
    <script>
      /* Before the first paint: the opening plays only on a session's first load, and
         not at all for people who ask for less motion. */
      (function () {
        var root = document.documentElement;
        var calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
        var first = false;
        try {
          first = !sessionStorage.getItem("homunculus_booted_v1");
          sessionStorage.setItem("homunculus_booted_v1", "1");
        } catch (e) {}
        if (!calm) root.classList.add("js");
        root.dataset.intro = first && !calm ? "0" : "done";
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Homunculus" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geologica:wght,CRSV,SHRP@200..500,0,0..100&family=Geist+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <title>Homunculus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
