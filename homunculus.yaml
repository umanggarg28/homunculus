# Homunculus runtime config
#
# Single source of truth for MCP servers. Edit this file and the running
# agent picks up changes on the next turn — no restart required (hot
# reload watches this path).
#
# Each server is launched as a subprocess; the manager talks to it over
# stdio using the MCP protocol. Tools surface to the LLM namespaced as
# `{server_name}.{tool_name}` so collisions are impossible and traces
# show provenance.

servers:

  # Homunculus's own tools (filesystem, memory, web, sandbox, scheduling,
  # notify). Runs in-tree but as its own process for symmetry with
  # external servers.
  builtin:
    command: ["python", "-m", "homunculus.tools.mcp_server"]
    permissions:
      mutating: true        # can write_file, remember, python, schedule, ...

  # fetch server removed — web_fetch in builtin covers the same need
  # without the confusing description that leaked implementation notes.
