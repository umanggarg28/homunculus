# docker-compose.yml for Homunculus
#
# Three services share the same image and the same workspace volume:
#
#   homunculus  → interactive REPL.
#                   docker compose run --rm homunculus
#
#   heartbeat   → autonomous daemon. Wakes every N minutes and self-
#                 prompts to do proactive work.
#                   docker compose up -d heartbeat
#                   docker compose logs -f heartbeat
#                   docker compose stop heartbeat
#
#   telegram    → messaging frontend. Talk to the agent from your phone.
#                   docker compose up -d telegram
#                   docker compose logs -f telegram
#                   docker compose stop telegram
#
# `run --rm` is for one-off interactive sessions (`up` doesn't attach
# stdin properly). `up -d` is for long-running detached daemons.

services:
  homunculus:
    build: .                    # Build from the Dockerfile in this directory
    image: homunculus:phase1    # Tag the resulting image
    stdin_open: true            # Keep stdin open (so input() works)
    tty: true                   # Allocate a TTY (so prompts render nicely)
    env_file: .env              # Load HOMUNCULUS_API_KEY etc. from .env
    environment:
      # Identifies which service emitted each event in the live feed.
      HOMUNCULUS_SERVICE: repl
      # /app contains the agent package; cwd is /app/workspace for data
      # paths. PYTHONPATH lets `python -m transports.repl` find the
      # package without changing the working_dir convention.
      PYTHONPATH: /app
    working_dir: /app/workspace # The agent's "current directory" inside the container
    volumes:
      # Mount a host directory as the agent's workspace, so files the
      # agent creates are visible in your editor on the host. The agent
      # can only read/write files INSIDE this directory by default.
      - ./workspace:/app/workspace
      # Docker socket → python_exec spawns sandbox containers via host's
      # docker daemon. Only our code uses this; the LLM only sees
      # stdout/stderr of the code it runs.
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["uv", "run", "--project", "/app", "python", "-m", "transports.repl"]

  heartbeat:
    build: .
    image: homunculus:phase1    # Same image — heartbeat reuses everything
    env_file: .env
    environment:
      HOMUNCULUS_SERVICE: heartbeat
      PYTHONPATH: /app
    working_dir: /app/workspace
    volumes:
      - ./workspace:/app/workspace  # Same workspace mount → shared memory
      - /var/run/docker.sock:/var/run/docker.sock  # for python_exec sandbox
    # Override the default CMD to launch the daemon instead of the REPL.
    command: ["uv", "run", "--project", "/app", "python", "/app/heartbeat.py"]
    # Auto-restart if the daemon crashes (but not if we explicitly stop it).
    restart: unless-stopped
    # No stdin_open/tty — this is a background daemon, not an interactive
    # process. Its output goes to `docker compose logs heartbeat`.

  telegram:
    build: .
    image: homunculus:phase1
    env_file: .env
    environment:
      HOMUNCULUS_SERVICE: telegram
      PYTHONPATH: /app
    working_dir: /app/workspace
    volumes:
      - ./workspace:/app/workspace  # Same workspace mount → shared memory
      - /var/run/docker.sock:/var/run/docker.sock  # for python_exec sandbox
    command: ["uv", "run", "--project", "/app", "python", "-m", "transports.telegram"]
    restart: unless-stopped
    # No stdin_open/tty — daemon that long-polls Telegram for messages.

  feed:
    build: .
    image: homunculus:phase1
    env_file: .env              # chat endpoint needs the LLM API key
    environment:
      HOMUNCULUS_SERVICE: feed
      PYTHONPATH: /app
    working_dir: /app/workspace  # so _events.jsonl resolves to workspace/_events.jsonl
    volumes:
      - ./workspace:/app/workspace  # read the shared events file + memory
      - /var/run/docker.sock:/var/run/docker.sock  # chat may call python_exec
    # Bind to 8765 on the host. Open http://localhost:8765 in a browser
    # for the full web UI. (8000 is a popular dev port and tends to
    # collide — 8765 avoids common defaults.)
    ports:
      - "127.0.0.1:8765:8765"
    command: ["uv", "run", "--project", "/app", "uvicorn", "transports.web_api:app", "--host", "0.0.0.0", "--port", "8765", "--app-dir", "/app"]
    restart: unless-stopped
