[project]
name = "homunculus"
version = "0.1.0"
description = "Minimal autonomous personal AI assistant — built from scratch, no frameworks."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-telegram-bot>=21",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "mcp>=1.0",
    "pyyaml>=6.0",
    "watchfiles>=0.24",
    "mcp-server-fetch>=2025.1.17",
    "markdown-it-py>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
