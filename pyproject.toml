[project]
name = "homunculus"
version = "0.1.0"
description = "An always-on personal agent that works toward your goals in its own sandbox and asks before anything leaves it."
readme = "README.md"
authors = [
    { name = "Umang Garg", email = "15011318+umanggarg28@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.154.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
homunculus = "homunculus:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
# Tests never reach the network; the model and HTTP calls are faked at the boundary.
addopts = "--disable-socket --allow-unix-socket"

[tool.ruff]
line-length = 100
# Code in the docs is aligned for reading; it is not run.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]
