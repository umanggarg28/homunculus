[project]
name = "homunculus"
version = "0.1.0"
description = "Minimal autonomous personal AI assistant — built from scratch, no frameworks."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-telegram-bot>=21",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "mcp>=1.0",
    "pyyaml>=6.0",
    "watchfiles>=0.24",
    "mcp-server-fetch>=2025.1.17",
    "markdown-it-py>=3.0",
    "discord-py>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Correctness (F, E, W), bugbear (B), modernization (UP), comprehensions
# (C4), and a few readability rules. Import sorting (I) is intentionally
# left off to avoid mass reordering churn.
select = ["F", "E", "W", "B", "UP", "C4", "RET", "PIE"]
ignore = [
    "E501",   # Line length: many legacy lines exceed 100; not worth reflowing.
    "RET504", # Assigning before return is often clearer than inlining.
    "RET505", # `else` after `return` reads fine and is widely used here.
    "E741",   # Single-letter names (l, I) appear in throwaway/math contexts.
]

[tool.ruff.lint.per-file-ignores]
# Tests and scripts import after sys.path / stub setup, so module-level
# imports legitimately sit below other statements.
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
